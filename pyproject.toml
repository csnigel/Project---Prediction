[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-statement-forecasting"
version = "0.1.0"
description = "Forecast nine current-quarter financial statement values from historical company data."
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
  "tqdm>=4.66,<5",
  "xgboost>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

